version: '3.8'

services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty-controller
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    ports:
      - "25565:25565"
    volumes:
      - crafty_data:/crafty

volumes:
  crafty_data: